                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  emailChanged:
                                                      const: true
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: EMAIL_CHANGE_INVALID, VALIDATION_ERROR."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
    /auth/change-email/undo:
        post:
            tags:
                - Auth
            operationId: undoEmailChange
            summary: Restore the previous address and revoke every session
            security: []
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                token: *a9
                            required:
                                - token
            responses:
                "200":
                    description: Email change undone. Sign in again.
