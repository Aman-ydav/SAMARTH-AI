openapi: 3.1.0
info:
    title: SAMARTH AI API
    version: 1.0.0
    summary: "Milestone 1: health, auth, profile, media"
    description: |-
        Hand-kept contract of the routes registered by the Express app (see docs/08-api-design.md). Every route is also a request in backend/postman/samarthAi.postman_collection.json.

        Success envelope: { statusCode, success: true, message, data, meta? }. Error envelope: { statusCode, success: false, message, code, errors[], data: null, requestId } (+ retryAfterSec on 423/429/503); requestId equals the X-Request-Id response header.
        Auth transport is cookies only (sai_access, sai_refresh, sai_csrf). Every POST, PUT, PATCH and DELETE needs the X-CSRF-Token header to equal the sai_csrf cookie (double submit), except the signature-verified Cloudinary webhook. No token is ever in a response body.
        A prototype / capstone product, not an official Government of India website.
    license:
        name: ISC
        identifier: ISC
servers:
    - url: /api/v1
      description: Same-site through the Vercel rewrite in production; http://localhost:8000/api/v1 in development
tags:
    - name: Health
    - name: Auth
    - name: Profile
    - name: Media
security: []
paths:
    /health:
        servers:
            - url: /
              description: Outside the API prefix
        get:
            tags:
                - Health
            operationId: getHealth
            summary: Process is alive (no dependencies)
            security: []
            responses:
                "200":
                    description: Alive
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  status:
                                                      const: ok
    /ready:
        servers:
            - url: /
              description: Outside the API prefix
        get:
            tags:
                - Health
            operationId: getReady
            summary: Database is connected
            security: []
            responses:
                "200":
                    description: Ready
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  status:
                                                      const: ready
                                                  db:
                                                      type: string
                                                      examples:
                                                          - connected
                "503":
                    $ref: "#/components/responses/Error503"
                    description: "Codes: INTEGRATION_ERROR (Retry-After header)."
    /auth/register:
        post:
            tags:
                - Auth
            operationId: register
            summary: Register a learner account
            description: Always answers 202 with one fixed message for new, existing and pending addresses (no enumeration). The role is always learner. The verification mail is sent after the response.
            security: []
            parameters:
                - &a1
                  $ref: "#/components/parameters/CsrfToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                name:
                                    type: string
                                    minLength: 1
                                    maxLength: 100
                                email: &a2
                                    type: string
                                    maxLength: 254
                                    format: email
                                    description: Trimmed, NFKC-normalised and lower-cased before every lookup.
                                password: &a4
                                    type: string
                                    minLength: 1
                                    maxLength: 256
                                    description: "Policy (server-enforced, PASSWORD_POLICY): at least 10 characters and at most 72 UTF-8 bytes, not on the common-password denylist, must not contain the email name or the display name. Never trimmed or echoed."
                                acceptTerms:
                                    const: true
                            required:
                                - name
                                - email
                                - password
                                - acceptTerms
            responses:
                "202":
                    description: Neutral message
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 202
                                          data: &a3
                                              type: "null"
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR, PASSWORD_POLICY, INVALID_JSON."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, DOMAIN_NOT_ALLOWED (also: CORS_ORIGIN_DENIED)."
                "413":
                    $ref: "#/components/responses/Error413"
                    description: "Codes: PAYLOAD_TOO_LARGE."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
    /auth/verify-email:
        post:
            tags:
                - Auth
            operationId: verifyEmail
            summary: Consume the email-verification token and sign in
            description: "POST only: opening the emailed link never consumes the token (R34). Token TTL 24 h, single use."
            security: []
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                token: &a9
                                    type: string
                                    minLength: 1
                                    maxLength: 512
                                    description: One-time token from the emailed link fragment (#token=...). Sent in the body, never in a URL.
                            required:
                                - token
            responses:
                "200":
                    description: Email verified; session started
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                        Set-Cookie:
                            description: sai_access (HttpOnly, Path=/, 15 min), sai_refresh (HttpOnly, Path=/api/v1/auth, 7 d sliding; 30 d with rememberMe) and sai_csrf (readable by JS, Path=/, same lifetime as sai_refresh); all SameSite=Lax, Secure in production.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data: &a5
                                              $ref: "#/components/schemas/AuthUserPayload"
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VERIFY_TOKEN_INVALID, VALIDATION_ERROR."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
    /auth/resend-verification:
        post:
            tags:
                - Auth
            operationId: resendVerification
            summary: Resend the verification mail (neutral answer)
            description: 60 s cooldown, 5 per hour per address; per-address limits are silent (same 200, no mail).
            security: []
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                email: *a2
                            required:
                                - email
            responses:
                "200":
                    description: Neutral message
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data: *a3
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED (per IP only)."
    /auth/login:
        post:
            tags:
                - Auth
            operationId: login
            summary: Sign in with email and password
            description: "Order: rate limit, lockout (shadow counters, identical for unknown emails), password, then account status. 5 failures lock for 15 min (doubling to 24 h). mustChangePassword users get only a 15-minute sai_access cookie (no refresh cookie) valid for POST /auth/change-password. A pending-deletion account that passes the password check signs in with reactivate: true."
            security: []
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                email: *a2
                                password: *a4
                                rememberMe:
                                    type: boolean
                                reactivate:
                                    type: boolean
                            required:
                                - email
                                - password
            responses:
                "200":
                    description: Signed in
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                        Set-Cookie:
                            description: sai_access (HttpOnly, Path=/, 15 min), sai_refresh (HttpOnly, Path=/api/v1/auth, 7 d sliding; 30 d with rememberMe) and sai_csrf (readable by JS, Path=/, same lifetime as sai_refresh); all SameSite=Lax, Secure in production.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data: *a5
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: INVALID_CREDENTIALS."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, EMAIL_NOT_VERIFIED, ACCOUNT_SUSPENDED, ACCOUNT_DEACTIVATED."
                "423":
                    $ref: "#/components/responses/Error423"
                    description: "Codes: ACCOUNT_LOCKED (retryAfterSec, Retry-After)."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED (10 per 15 min per address)."
    /auth/google:
        post:
            tags:
                - Auth
            operationId: googleSignIn
            summary: Sign in with a Google ID token
            description: The ID token is verified server-side (signature, aud, iss, exp, email_verified). When GOOGLE_CLIENT_ID is not configured the API answers 403 FORBIDDEN.
            security: []
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                credential: &a6
                                    type: string
                                    minLength: 10
                                    maxLength: 4096
                                    description: Fresh Google ID token (accounts without a password).
                                nonce:
                                    type: string
                                    minLength: 1
                                    maxLength: 256
                                reactivate:
                                    type: boolean
                            required:
                                - credential
            responses:
                "200":
                    description: Signed in with Google
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                        Set-Cookie:
                            description: sai_access (HttpOnly, Path=/, 15 min), sai_refresh (HttpOnly, Path=/api/v1/auth, 7 d sliding; 30 d with rememberMe) and sai_csrf (readable by JS, Path=/, same lifetime as sai_refresh); all SameSite=Lax, Secure in production.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data: *a5
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: GOOGLE_TOKEN_INVALID, GOOGLE_EMAIL_UNVERIFIED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, DOMAIN_NOT_ALLOWED, FORBIDDEN, EMAIL_NOT_VERIFIED, ACCOUNT_SUSPENDED, ACCOUNT_DEACTIVATED."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
                "502":
                    $ref: "#/components/responses/Error502"
                    description: "Codes: INTEGRATION_ERROR."
        delete:
            tags:
                - Auth
            operationId: unlinkGoogle
            summary: Unlink Google from the account
            security: &a8
                - accessCookie: []
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                credential: *a6
                            required:
                                - credential
            responses:
                "200":
                    description: Google unlinked
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  user:
                                                      $ref: "#/components/schemas/UserSummary"
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_INVALID, SESSION_REVOKED, GOOGLE_TOKEN_INVALID."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, REAUTH_REQUIRED, MUST_CHANGE_PASSWORD, FORBIDDEN."
                "409":
                    $ref: "#/components/responses/Error409"
                    description: "Codes: CONFLICT (Google not linked), AUTH_METHOD_REQUIRED (last sign-in method)."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
    /auth/refresh:
        post:
            tags:
                - Auth
            operationId: refresh
            summary: Rotate the refresh cookie
            description: Authenticated by the sai_refresh cookie. Every failure is REFRESH_INVALID. A rotated token replayed inside the 10 s grace window gets only a new sai_access cookie; replayed later it is treated as theft (family revoked, owner mailed).
            security:
                - refreshCookie: []
            parameters:
                - *a1
            requestBody: &a7
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties: {}
            responses:
                "200":
                    description: Session refreshed
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                        Set-Cookie:
                            description: All three session cookies are re-issued (rotation); inside the grace window only sai_access.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data: *a3
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: REFRESH_INVALID."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
    /auth/logout:
        post:
            tags:
                - Auth
            operationId: logout
            summary: Sign out (idempotent)
            description: Works without a session. Revokes the session of the refresh cookie when present and clears all three cookies with the attributes they were set with.
            security: []
            parameters:
                - *a1
            requestBody: *a7
            responses:
                "200":
                    description: Signed out
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                        Set-Cookie:
                            description: sai_access, sai_refresh and sai_csrf cleared.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data: *a3
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID."
    /auth/logout-all:
        post:
            tags:
                - Auth
            operationId: logoutAll
            summary: Revoke every session of the user
            security: *a8
            parameters:
                - *a1
            requestBody: *a7
            responses:
                "200":
                    description: Signed out everywhere
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                        Set-Cookie:
                            description: sai_access, sai_refresh and sai_csrf cleared.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data: *a3
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_EXPIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, MUST_CHANGE_PASSWORD."
    /auth/me:
        get:
            tags:
                - Auth
            operationId: me
            summary: Current user (the only identity source for the frontend)
            security: *a8
            responses:
                "200":
                    description: Current user
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  user:
                                                      $ref: "#/components/schemas/UserSummary"
                                                  needsOnboarding:
                                                      type: boolean
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR (unexpected query parameter)."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_EXPIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: MUST_CHANGE_PASSWORD, ACCOUNT_SUSPENDED, ACCOUNT_DEACTIVATED."
    /auth/sessions:
        get:
            tags:
                - Auth
            operationId: listSessions
            summary: Live sessions of the user (at most 10)
            security: *a8
            responses:
                "200":
                    description: Sessions
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  items:
                                                      type: array
                                                      items:
                                                          $ref: "#/components/schemas/SessionItem"
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_EXPIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: MUST_CHANGE_PASSWORD."
    /auth/sessions/{id}:
        delete:
            tags:
                - Auth
            operationId: revokeSession
            summary: Revoke one of the user's own sessions
            description: Revoking the current session acts as logout and clears the cookies. Another user's or an unknown session is NOT_FOUND, never 403.
            security: *a8
            parameters:
                - *a1
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      maxLength: 64
                  description: Session id (the refresh family id, an ObjectId hex string).
            responses:
                "200":
                    description: Session revoked
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                        Set-Cookie:
                            description: "Only when the current session was revoked: all three cookies cleared."
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data: *a3
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: INVALID_ID."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_EXPIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, MUST_CHANGE_PASSWORD."
                "404":
                    $ref: "#/components/responses/Error404"
                    description: "Codes: NOT_FOUND."
    /auth/forgot-password:
        post:
            tags:
                - Auth
            operationId: forgotPassword
            summary: Request a password-reset mail (neutral answer)
            description: Always 200 with the same message for every address; the lookup, the 3-per-hour per-address cap and the mail happen after the response. Reset token TTL 30 min.
            security: []
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                email: *a2
                            required:
                                - email
            responses:
                "200":
                    description: Neutral message
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data: *a3
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED (per IP only)."
    /auth/reset-password/validate:
        post:
            tags:
                - Auth
            operationId: validateResetToken
            summary: Check a reset token without consuming it
            security: []
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                token: *a9
                            required:
                                - token
            responses:
                "200":
                    description: Reset link is valid
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  valid:
                                                      const: true
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: RESET_TOKEN_INVALID, VALIDATION_ERROR."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
    /auth/reset-password:
        post:
            tags:
                - Auth
            operationId: resetPassword
            summary: Set a new password with a reset token (no auto-login)
            description: Validates the new password (policy, not equal to the current or last 3) BEFORE consuming the token, then consumes it atomically, bumps the token version, revokes all sessions and clears lockout counters.
            security: []
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                token: *a9
                                newPassword: *a4
                            required:
                                - token
                                - newPassword
            responses:
                "200":
                    description: Password updated. Sign in with your new password.
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data: *a3
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: RESET_TOKEN_INVALID, PASSWORD_POLICY, PASSWORD_REUSED, VALIDATION_ERROR."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
    /auth/change-password:
        post:
            tags:
                - Auth
            operationId: changePassword
            summary: Change (or set) the password
            description: The only route a must-change-password (limited) session may call; it then becomes a normal session. Bumps the token version and revokes the user's other sessions. The response re-issues sai_access and sai_csrf (a limited session also gets sai_refresh).
            security: *a8
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                currentPassword: *a4
                                credential: *a6
                                newPassword: *a4
                            required:
                                - newPassword
                            oneOf: &a10
                                - required:
                                      - currentPassword
                                  not:
                                      required:
                                          - credential
                                - required:
                                      - credential
                                  not:
                                      required:
                                          - currentPassword
            responses:
                "200":
                    description: Password changed
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                        Set-Cookie:
                            description: sai_access and sai_csrf re-issued.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data: *a5
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR, PASSWORD_POLICY, PASSWORD_REUSED."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: INVALID_CREDENTIALS (wrong current password), AUTH_REQUIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, REAUTH_REQUIRED."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED (10 per hour per user)."
    /auth/change-email:
        post:
            tags:
                - Auth
            operationId: changeEmail
            summary: Start an email change (neutral 202)
            description: Needs the current password (or a fresh Google credential). The new address gets a confirmation link, the old address a notice with a 24 h undo link. An address that is the current one or owned by someone else silently sends nothing.
            security: *a8
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                currentPassword: *a4
                                credential: *a6
                                newEmail: *a2
                            required:
                                - newEmail
                            oneOf: *a10
            responses:
                "202":
                    description: Neutral message
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 202
                                          data: *a3
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: INVALID_CREDENTIALS, AUTH_REQUIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, DOMAIN_NOT_ALLOWED, REAUTH_REQUIRED, MUST_CHANGE_PASSWORD."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED (5 per hour per user)."
    /auth/change-email/confirm:
        post:
            tags:
                - Auth
            operationId: confirmEmailChange
            summary: Apply the new address from the confirmation link
            security: []
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                token: *a9
                            required:
                                - token
            responses:
                "200":
                    description: Email address updated
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
