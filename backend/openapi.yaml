                                              properties:
                                                  restored:
                                                      const: true
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: EMAIL_CHANGE_INVALID, VALIDATION_ERROR."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
    /auth/account:
        delete:
            tags:
                - Auth
            operationId: deleteAccount
            summary: Schedule account deletion (30-day grace)
            description: "Re-authentication required. Revokes all sessions and clears the cookies. Signing in during the grace period cancels the deletion (the login response carries reactivate: true)."
            security: *a8
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                currentPassword: *a4
                                credential: *a6
                            oneOf: *a10
            responses:
                "200":
                    description: Account scheduled for deletion
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                        Set-Cookie:
                            description: sai_access, sai_refresh and sai_csrf cleared.
