                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  graceEndsAt:
                                                      type: string
                                                      format: date-time
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: INVALID_CREDENTIALS, AUTH_REQUIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, REAUTH_REQUIRED, MUST_CHANGE_PASSWORD."
                "409":
                    $ref: "#/components/responses/Error409"
                    description: "Codes: LAST_ADMIN."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED (5 per hour per user)."
    /auth/accept-invite:
        post:
            tags:
                - Auth
            operationId: acceptInvite
            summary: Accept an invitation and sign in
            description: Invites are created by the admin module (not exposed over HTTP yet). Token TTL 7 d, single use; the role comes from the invite, never from the body.
            security: []
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                token: *a9
                                name:
                                    type: string
                                    minLength: 1
                                    maxLength: 100
                                password: *a4
                            required:
                                - token
                                - name
                                - password
            responses:
                "200":
                    description: Invitation accepted
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                        Set-Cookie:
                            description: sai_access (HttpOnly, Path=/, 15 min), sai_refresh (HttpOnly, Path=/api/v1/auth, 7 d sliding; 30 d with rememberMe) and sai_csrf (readable by JS, Path=/, same lifetime as sai_refresh); all SameSite=Lax, Secure in production.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data: *a5
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: INVITE_INVALID, PASSWORD_POLICY, VALIDATION_ERROR."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, DOMAIN_NOT_ALLOWED."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
    /profile:
        get:
            tags:
                - Profile
            operationId: getProfile
            summary: The signed-in user's profile
            security: *a8
            responses:
                "200":
                    description: Profile
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  user:
                                                      $ref: "#/components/schemas/ProfileUser"
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR (unexpected query parameter)."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_EXPIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: MUST_CHANGE_PASSWORD."
        put:
            tags:
                - Profile
            operationId: updateProfile
            summary: Update name, locale and timezone (partial)
            description: Only these three fields are writable; role, status, orgId and email in the body are refused as unknown fields.
            security: *a8
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                name:
                                    type: string
                                    minLength: 1
                                    maxLength: 100
                                locale:
                                    enum:
                                        - en
                                        - hi
                                timezone:
                                    type: string
                                    minLength: 1
                                    maxLength: 64
                                    examples:
                                        - Asia/Kolkata
                            minProperties: 1
            responses:
                "200":
                    description: Profile updated
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  user:
                                                      $ref: "#/components/schemas/ProfileUser"
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_EXPIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, MUST_CHANGE_PASSWORD."
    /media/signatures:
        post:
            tags:
                - Media
            operationId: requestMediaSignature
            summary: Signed parameters for a direct browser upload to Cloudinary
            description: "Role by kind: marketing admin and superadmin; learning-content and temp trainer, admin, superadmin; avatars (use PUT /me/avatar) and certificates (server-issued) nobody. Only server-decided values are signed; the API secret never leaves the server. Shares a 20-per-day bucket per user with POST /media/confirm."
            security: *a8
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                kind:
                                    enum:
                                        - avatars
                                        - marketing
                                        - learning-content
                                        - certificates
                                        - temp
                                resourceType:
                                    enum:
                                        - image
                                        - video
                                        - raw
                                contentType:
                                    type: string
                                    minLength: 3
                                    maxLength: 120
                                    examples:
                                        - video/mp4
                                bytes:
                                    type: integer
                                    minimum: 0
                                filename:
                                    type: string
                                    minLength: 1
                                    maxLength: 255
                                    description: Only used to cross-check the extension.
                            required:
                                - kind
                                - resourceType
                                - contentType
                                - bytes
            responses:
                "201":
                    description: Upload signature issued
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 201
                                          data:
                                              $ref: "#/components/schemas/MediaSignature"
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR, MEDIA_TYPE_NOT_ALLOWED, UPLOAD_INVALID."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, FORBIDDEN, MUST_CHANGE_PASSWORD."
                "413":
                    $ref: "#/components/responses/Error413"
                    description: "Codes: MEDIA_TOO_LARGE."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
    /media/confirm:
        post:
            tags:
                - Media
            operationId: confirmMediaUpload
            summary: Confirm a direct upload from Cloudinary's real asset
            description: "Never trusts client metadata: fetches the asset, re-checks type, format and size, deletes and retires a mismatching asset. Repeating a confirm of a ready record returns it unchanged."
            security: *a8
            parameters:
                - *a1
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                mediaId:
                                    type: string
                                    minLength: 1
                                    maxLength: 24
                                publicId:
                                    type: string
                                    minLength: 1
                                    maxLength: 255
                            oneOf:
                                - required:
                                      - mediaId
                                  not:
                                      required:
                                          - publicId
                                - required:
                                      - publicId
                                  not:
                                      required:
                                          - mediaId
            responses:
                "200":
                    description: Upload confirmed
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              $ref: "#/components/schemas/Media"
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR, INVALID_ID, MEDIA_TYPE_NOT_ALLOWED, UPLOAD_INVALID."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID, FORBIDDEN."
                "404":
                    $ref: "#/components/responses/Error404"
                    description: "Codes: MEDIA_NOT_FOUND (also another owner's record)."
                "413":
                    $ref: "#/components/responses/Error413"
                    description: "Codes: MEDIA_TOO_LARGE."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
                "502":
                    $ref: "#/components/responses/Error502"
                    description: "Codes: INTEGRATION_ERROR."
    /media/webhook:
        post:
            tags:
                - Media
            operationId: cloudinaryWebhook
            summary: Cloudinary notification (signature verified, CSRF-exempt)
            description: Public route; trust comes from X-Cld-Signature over the RAW body and X-Cld-Timestamp (at most 2 hours old). Reconciles state idempotently by publicId + version; it never makes a record ready. Unknown or irrelevant notifications are acknowledged with action ignored.
            security: []
            parameters:
                - name: X-Cld-Signature
                  in: header
                  required: true
                  schema:
                      type: string
                  description: Hex digest of the raw body + timestamp + API secret.
                - name: X-Cld-Timestamp
                  in: header
                  required: true
                  schema:
                      type: integer
                  description: Unix seconds.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - notification_type
                            properties:
                                notification_type:
                                    type: string
                                public_id:
                                    type: string
                                version:
                                    type: integer
                            additionalProperties: true
            responses:
                "200":
                    description: Processed
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  received:
                                                      const: true
                                                  action:
                                                      enum:
                                                          - reconciled
                                                          - rejected
                                                          - deleted
                                                          - ignored
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: WEBHOOK_SIGNATURE_INVALID (missing, bad or stale), INVALID_JSON."
                "413":
                    $ref: "#/components/responses/Error413"
                    description: "Codes: PAYLOAD_TOO_LARGE."
    /media/{id}/access:
        get:
            tags:
                - Media
            operationId: getMediaAccess
            summary: Short-lived signed URL for an authenticated asset
            description: Owner, or admin / superadmin of the same organisation. Public assets need no link (422 UNPROCESSABLE).
            security: *a8
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      maxLength: 64
                  description: Media record id (ObjectId).
            responses:
                "200":
                    description: Access link issued
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
