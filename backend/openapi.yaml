                            type: object
                            required:
                                - file
                            properties:
                                file:
                                    type: string
                                    contentMediaType: image/*
                                    format: binary
                            additionalProperties: false
            responses:
                "200":
                    description: Avatar updated
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  user:
                                                      $ref: "#/components/schemas/UserSummary"
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: MEDIA_TYPE_NOT_ALLOWED, UPLOAD_INVALID, VALIDATION_ERROR."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID."
                "413":
                    $ref: "#/components/responses/Error413"
                    description: "Codes: FILE_TOO_LARGE."
                "429":
                    $ref: "#/components/responses/Error429"
                    description: "Codes: RATE_LIMITED."
                "502":
                    $ref: "#/components/responses/Error502"
                    description: "Codes: MEDIA_UPLOAD_FAILED."
        delete:
            tags:
                - Media
            operationId: deleteAvatar
            summary: Remove the avatar (idempotent)
            security: *a8
            parameters:
                - *a1
            requestBody: *a7
            responses:
                "200":
                    description: Avatar removed
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  user:
                                                      $ref: "#/components/schemas/UserSummary"
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: VALIDATION_ERROR."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID."
components:
    securitySchemes:
        accessCookie:
            type: apiKey
            in: cookie
            name: sai_access
            description: "HttpOnly JWT (HS256), Path=/, 15 minutes. Claims: sub, role, orgId, sid, tv."
        refreshCookie:
            type: apiKey
            in: cookie
            name: sai_refresh
            description: HttpOnly opaque token, Path=/api/v1/auth, rotated on every use.
        csrfCookie:
            type: apiKey
            in: cookie
            name: sai_csrf
            description: Readable by JS, Path=/. Mirror it in the X-CSRF-Token header on unsafe methods.
    parameters:
        CsrfToken:
            name: X-CSRF-Token
            in: header
            required: true
            description: Must equal the sai_csrf cookie (constant-time compare) on POST, PUT, PATCH and DELETE, otherwise 403 CSRF_INVALID. The cookie is issued by any /api/v1 response that lacks it (for example GET /auth/me).
            schema:
                type: string
                minLength: 32
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
    headers:
        RequestId:
            description: Accepted from the client when 8-64 safe characters, otherwise generated. Same value as requestId in error bodies.
            schema:
                type: string
        RetryAfter:
            description: Seconds until the limit or lock ends.
            schema:
                type: integer
    responses:
        Error400:
            description: "Bad input: the error envelope."
            headers:
                X-Request-Id:
                    $ref: "#/components/headers/RequestId"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorEnvelope"
        Error401:
            description: "Not authenticated: the error envelope."
            headers:
                X-Request-Id:
                    $ref: "#/components/headers/RequestId"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorEnvelope"
        Error403:
            description: "Forbidden, CSRF or policy: the error envelope."
            headers:
                X-Request-Id:
                    $ref: "#/components/headers/RequestId"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorEnvelope"
        Error404:
            description: "Missing or not yours: the error envelope."
            headers:
                X-Request-Id:
                    $ref: "#/components/headers/RequestId"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorEnvelope"
        Error409:
            description: "Conflict: the error envelope."
            headers:
                X-Request-Id:
                    $ref: "#/components/headers/RequestId"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorEnvelope"
        Error413:
            description: "Too large: the error envelope."
            headers:
                X-Request-Id:
                    $ref: "#/components/headers/RequestId"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorEnvelope"
        Error422:
            description: "Unprocessable state: the error envelope."
            headers:
                X-Request-Id:
                    $ref: "#/components/headers/RequestId"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorEnvelope"
        Error423:
            description: "Account locked: the error envelope."
            headers:
                X-Request-Id:
                    $ref: "#/components/headers/RequestId"
                Retry-After:
                    $ref: "#/components/headers/RetryAfter"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorEnvelope"
        Error429:
            description: "Rate limited: the error envelope."
            headers:
                X-Request-Id:
                    $ref: "#/components/headers/RequestId"
                Retry-After:
                    $ref: "#/components/headers/RetryAfter"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorEnvelope"
        Error502:
            description: "Upstream failed: the error envelope."
            headers:
                X-Request-Id:
                    $ref: "#/components/headers/RequestId"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorEnvelope"
        Error503:
            description: "Not ready: the error envelope."
            headers:
                X-Request-Id:
                    $ref: "#/components/headers/RequestId"
                Retry-After:
                    $ref: "#/components/headers/RetryAfter"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorEnvelope"
    schemas:
        SuccessEnvelope:
            type: object
            required:
                - statusCode
                - success
                - message
                - data
            properties:
                statusCode:
                    type: integer
                success:
                    const: true
                message:
                    type: string
                data: {}
                meta:
                    type: object
                    description: Pagination or request metadata (not used by milestone 1).
            additionalProperties: false
        ErrorEnvelope:
            type: object
            required:
                - statusCode
                - success
                - message
                - code
                - errors
                - data
                - requestId
            properties:
                statusCode:
                    type: integer
                success:
                    const: false
                message:
                    type: string
                    description: Safe text, no internals.
                code:
                    enum:
                        - VALIDATION_ERROR
                        - BAD_REQUEST
                        - INVALID_ID
                        - INVALID_JSON
                        - UPLOAD_INVALID
                        - PASSWORD_POLICY
                        - PASSWORD_REUSED
                        - VERIFY_TOKEN_INVALID
                        - RESET_TOKEN_INVALID
                        - INVITE_INVALID
                        - EMAIL_CHANGE_INVALID
                        - WEBHOOK_SIGNATURE_INVALID
                        - MEDIA_TYPE_NOT_ALLOWED
                        - INVALID_CREDENTIALS
                        - AUTH_REQUIRED
                        - TOKEN_EXPIRED
                        - TOKEN_INVALID
                        - REFRESH_INVALID
                        - SESSION_REVOKED
                        - TOKEN_REUSE_DETECTED
                        - GOOGLE_TOKEN_INVALID
                        - GOOGLE_EMAIL_UNVERIFIED
                        - MFA_REQUIRED
                        - MFA_INVALID
                        - FORBIDDEN
                        - CSRF_INVALID
                        - CORS_ORIGIN_DENIED
                        - REAUTH_REQUIRED
                        - DOMAIN_NOT_ALLOWED
                        - EMAIL_NOT_VERIFIED
                        - ACCOUNT_SUSPENDED
                        - ACCOUNT_DEACTIVATED
                        - ACCOUNT_PENDING_DELETION
                        - MUST_CHANGE_PASSWORD
                        - NOT_FOUND
                        - MEDIA_NOT_FOUND
                        - CONFLICT
                        - LAST_ADMIN
                        - AUTH_METHOD_REQUIRED
                        - PAYLOAD_TOO_LARGE
                        - FILE_TOO_LARGE
                        - MEDIA_TOO_LARGE
                        - UNSUPPORTED_MEDIA_TYPE
                        - UNPROCESSABLE
                        - ACCOUNT_LOCKED
                        - RATE_LIMITED
                        - INTERNAL
                        - INTEGRATION_ERROR
                        - MEDIA_UPLOAD_FAILED
                        - AI_UNAVAILABLE
                    description: Stable UPPER_SNAKE code.
                errors:
                    type: array
                    items:
                        $ref: "#/components/schemas/ErrorItem"
                data:
                    type: "null"
                requestId:
                    type: string
                retryAfterSec:
                    type: integer
                    description: Present on 423, 429 and 503.
            additionalProperties: false
        ErrorItem:
            type: object
            required:
                - message
            properties:
                field:
                    type: string
                    description: Dotted field path; query and path problems are prefixed (query.x, params.id).
                message:
                    type: string
                code:
                    type: string
            additionalProperties: false
        UserSummary:
            type: object
            description: "Explicit allow-list: never a hash, token or schema internal."
            required:
                - id
                - email
                - name
                - role
                - orgId
                - status
                - locale
                - emailVerified
                - authProviders
                - hasPassword
                - avatar
                - mustChangePassword
            additionalProperties: false
            properties:
                id:
                    type: string
                email:
                    type: string
                    format: email
                name:
                    type: string
                role:
                    enum:
                        - learner
                        - trainer
                        - admin
                        - superadmin
                orgId:
                    type: string
                status:
                    enum:
                        - invited
                        - pending_verification
                        - active
                        - suspended
                        - deactivated
                        - pending_deletion
                        - deleted
                locale:
                    enum:
                        - en
                        - hi
                emailVerified:
                    type: boolean
                authProviders:
                    type: array
                    items:
                        enum:
                            - local
                            - google
                            - sso
                hasPassword:
                    type: boolean
                avatar:
                    oneOf:
                        - type: "null"
                        - type: object
                          additionalProperties: false
                          properties:
                              publicId:
                                  type: string
                              version:
                                  type:
                                      - integer
                                      - "null"
                          required:
                              - publicId
                              - version
                mustChangePassword:
                    type: boolean
        ProfileUser:
            type: object
            description: "Explicit allow-list: never a hash, token or schema internal."
            required:
                - timezone
                - id
                - email
                - name
                - role
                - orgId
                - status
                - locale
                - emailVerified
                - authProviders
                - hasPassword
                - avatar
                - mustChangePassword
            additionalProperties: false
            properties:
                timezone:
                    type: string
                    examples:
                        - Asia/Kolkata
                id:
                    type: string
                email:
                    type: string
                    format: email
                name:
                    type: string
                role:
                    enum:
                        - learner
                        - trainer
                        - admin
                        - superadmin
                orgId:
                    type: string
                status:
                    enum:
                        - invited
                        - pending_verification
                        - active
                        - suspended
                        - deactivated
                        - pending_deletion
                        - deleted
                locale:
                    enum:
                        - en
                        - hi
                emailVerified:
                    type: boolean
                authProviders:
                    type: array
                    items:
                        enum:
                            - local
                            - google
                            - sso
                hasPassword:
                    type: boolean
                avatar:
                    oneOf:
                        - type: "null"
                        - type: object
                          additionalProperties: false
                          properties:
                              publicId:
                                  type: string
                              version:
                                  type:
                                      - integer
                                      - "null"
                          required:
                              - publicId
                              - version
                mustChangePassword:
                    type: boolean
        AuthUserPayload:
            type: object
            additionalProperties: false
            properties:
                user:
                    $ref: "#/components/schemas/UserSummary"
                needsOnboarding:
                    type: boolean
                reactivate:
                    type: boolean
                    description: True when this sign-in cancelled a pending deletion or reactivated a deactivated account.
            required:
                - user
                - needsOnboarding
                - reactivate
        SessionItem:
            type: object
            additionalProperties: false
            properties:
                id:
                    type: string
                device:
                    type: string
                    examples:
                        - Chrome on Windows
                createdAt:
                    type: string
                    format: date-time
                lastUsedAt:
                    type: string
                    format: date-time
                current:
                    type: boolean
            required:
                - id
                - device
                - createdAt
                - lastUsedAt
                - current
        Media:
            type: object
            additionalProperties: false
            properties:
                id:
                    type: string
                kind:
                    enum:
                        - avatars
                        - marketing
                        - learning-content
                        - certificates
                        - temp
                publicId:
                    type: string
                resourceType:
                    enum:
                        - image
                        - video
                        - raw
                deliveryType:
                    enum:
                        - public
                        - authenticated
                format:
                    type:
                        - string
                        - "null"
                bytes:
                    type:
                        - integer
                        - "null"
                width:
                    type:
                        - integer
                        - "null"
                height:
                    type:
                        - integer
                        - "null"
                duration:
                    type:
                        - number
                        - "null"
                version:
                    type:
                        - integer
                        - "null"
                status:
                    enum:
                        - pending
                        - ready
                        - deleted
            required:
                - id
                - kind
                - publicId
                - resourceType
                - deliveryType
                - format
                - bytes
                - width
                - height
                - duration
                - version
                - status
        MediaSignature:
            type: object
            additionalProperties: false
            properties:
                mediaId:
                    type: string
                cloudName:
                    type: string
                apiKey:
                    type: string
                    description: Public key; the API secret is never returned.
                timestamp:
                    type: integer
                signature:
                    type: string
                folder:
                    type: string
                    examples:
                        - samarth-ai/prod/learning-content
                publicId:
                    type: string
                    description: Server-chosen; never derived from the client filename.
                allowedFormats:
                    type: string
                    examples:
                        - mp4,webm,mov
                resourceType:
                    enum:
                        - image
                        - video
                        - raw
                type:
                    enum:
                        - upload
                        - authenticated
                maxBytes:
                    type: integer
                expiresAt:
                    type: string
                    format: date-time
                    description: One hour after issue.
                uploadParams:
                    type: object
                    description: The exact fields to send to Cloudinary with the file.
                    additionalProperties: true
            required:
                - mediaId
                - cloudName
                - apiKey
                - timestamp
                - signature
                - folder
                - publicId
                - allowedFormats
                - resourceType
                - type
                - maxBytes
                - expiresAt
                - uploadParams
