                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  mediaId:
                                                      type: string
                                                  url:
                                                      type: string
                                                      format: uri
                                                  expiresAt:
                                                      type: string
                                                      format: date-time
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: INVALID_ID."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_INVALID, SESSION_REVOKED."
                "404":
                    $ref: "#/components/responses/Error404"
                    description: "Codes: MEDIA_NOT_FOUND."
                "422":
                    $ref: "#/components/responses/Error422"
                    description: "Codes: UNPROCESSABLE."
    /media/{id}:
        delete:
            tags:
                - Media
            operationId: deleteMedia
            summary: Delete a media record and its Cloudinary asset
            description: Owner, or admin / superadmin of the same organisation. Deletes by the stored publicId. Avatars are removed with DELETE /me/avatar (409 CONFLICT here).
            security: *a8
            parameters:
                - *a1
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      maxLength: 64
                  description: Media record id (ObjectId).
            responses:
                "200":
                    description: Media deleted
                    headers:
                        X-Request-Id:
                            $ref: "#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/SuccessEnvelope"
                                    - type: object
                                      properties:
                                          statusCode:
                                              const: 200
                                          data:
                                              type: object
                                              additionalProperties: false
                                              properties:
                                                  id:
                                                      type: string
                                                  status:
                                                      const: deleted
                "400":
                    $ref: "#/components/responses/Error400"
                    description: "Codes: INVALID_ID."
                "401":
                    $ref: "#/components/responses/Error401"
                    description: "Codes: AUTH_REQUIRED, TOKEN_INVALID, SESSION_REVOKED."
                "403":
                    $ref: "#/components/responses/Error403"
                    description: "Codes: CSRF_INVALID."
                "404":
                    $ref: "#/components/responses/Error404"
                    description: "Codes: MEDIA_NOT_FOUND."
                "409":
                    $ref: "#/components/responses/Error409"
                    description: "Codes: CONFLICT (avatar)."
    /me/avatar:
        put:
            tags:
                - Media
            operationId: putAvatar
            summary: Upload or replace the avatar (multipart, JPEG/PNG/WebP up to 2 MB)
            description: Type, extension and magic bytes are checked before Cloudinary sees the file; EXIF/GPS is stripped. Any extra text field is refused. A failed upload keeps the old avatar. 20 per day per user.
            security: *a8
            parameters:
